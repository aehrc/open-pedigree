name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # (the FHIR definitions the Pages deploy publishes still build)
      - run: node scripts/build-fhir-site.js "$RUNNER_TEMP/fhir-site"
      - run: npm test
