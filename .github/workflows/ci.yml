name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # (the FHIR definitions the Pages deploy publishes still build)
      - run: node scripts/build-fhir-site.js "$RUNNER_TEMP/fhir-site"
      # (the website builds, and each published example still matches its source, drawn by this build)
      - run: node scripts/build-site.js "$RUNNER_TEMP/site"
      - run: npx playwright install --with-deps chromium
      - run: npm run examples:check
      # the examples as layout tests, the website's hand-off, and the editor's ?example key, against
      # the built dist/ served statically (the config's dev server reloads on test output)
      - run: |
          python3 -m http.server 9000 --bind 127.0.0.1 >/dev/null 2>&1 &
          npx playwright test tests/e2e/example-layouts.spec.js tests/e2e/site.spec.js tests/e2e/example-key.spec.js
      - run: npm test
