name: security-scan

on:
  pull_request:
  push:
    branches: [main]
  # New advisories land on the registry without any change here; catch them on main weekly
  # (same slot as codeql.yml) rather than waiting for the next PR.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: node scripts/audit-check.js
